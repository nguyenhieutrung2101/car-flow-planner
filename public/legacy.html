<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Flow Planner</title>
<style>
:root{
  --bg:#f5f6f7; --panel:#ffffff; --line:#d8dbde; --line2:#c2c6ca;
  --txt:#22262a; --mut:#6b7278; --hdr:#2f3437;
  --ok:#3d8b5f; --warn:#b7791f; --bad:#c0392b;
  --colw:96px; --leftw:236px; --cardh:46px; --occh:18px;
  --accent:#2e5d8c;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{font:12px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--txt); background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
button{font:inherit; cursor:pointer}
a{color:var(--accent)}

/* ===== toolbar ===== */
#toolbar{display:flex; align-items:center; gap:8px; padding:7px 12px;
  background:var(--hdr); color:#e8eaec; flex:none; flex-wrap:wrap}
#toolbar h1{font-size:13px; font-weight:600; margin-right:4px; letter-spacing:.2px}
.tbtn{background:#3d4347; color:#e8eaec; border:1px solid #565c60;
  padding:4px 10px; border-radius:3px; font-size:12px}
.tbtn:hover{background:#4a5054}
.tbtn.primary{background:var(--accent); border-color:var(--accent)}
.tbtn.primary:hover{background:#376ba0}
#toolbar .sep{width:1px; height:20px; background:#4a5054; margin:0 2px}
#langBtn{margin-left:auto; min-width:46px; font-weight:700}

/* ===== tabs ===== */
#tabs{display:flex; gap:2px; background:var(--hdr); padding:0 12px; flex:none}
.tab{background:transparent; color:#aab1b6; border:none; padding:7px 14px 8px;
  font-size:12px; font-weight:600; border-bottom:3px solid transparent}
.tab:hover{color:#e8eaec}
.tab.on{color:#fff; border-bottom-color:var(--accent)}

/* ===== layout ===== */
#main{flex:1; display:flex; min-height:0}
#boardwrap{flex:1; overflow:auto; position:relative; background:var(--bg)}
#board{display:inline-block; min-width:100%}

/* ===== board grid (giữ nguyên v1) ===== */
.mrow{display:flex; position:sticky; top:0; z-index:30}
.mcorner{position:sticky; left:0; z-index:31; width:var(--leftw); flex:none;
  background:#e9ebed; border-bottom:2px solid var(--line2); border-right:2px solid var(--line2);
  padding:5px 8px; font-weight:600; color:var(--mut); font-size:11px; display:flex; align-items:flex-end}
.mcell{width:var(--colw); flex:none; background:#e9ebed;
  border-bottom:2px solid var(--line2); border-right:1px solid var(--line);
  padding:4px 6px; text-align:center; font-weight:600; font-size:11px}
.mcell .yy{display:block; font-weight:400; color:var(--mut); font-size:10px}
.secrow{display:flex}
.sectitle{position:sticky; left:0; z-index:21; background:#dfe2e5;
  border-bottom:1px solid var(--line2); border-right:2px solid var(--line2);
  width:var(--leftw); flex:none; padding:4px 8px; font-size:11px; font-weight:700;
  letter-spacing:.6px; color:#4a5054; display:flex; align-items:center; justify-content:space-between}
.sectitle .addloc{border:1px solid #b8bcc0; background:#fff; border-radius:3px;
  font-size:11px; padding:1px 7px; color:var(--accent); font-weight:600}
.secfill{flex:1; background:#dfe2e5; border-bottom:1px solid var(--line2)}
.lrow{display:flex; border-bottom:1px solid var(--line)}
.rowhead{position:sticky; left:0; z-index:15; width:var(--leftw); flex:none;
  background:var(--panel); border-right:2px solid var(--line2); padding:6px 8px; cursor:pointer}
.rowhead:hover{background:#f2f7fc}
.rowhead .nm{font-weight:700; font-size:12px; display:flex; gap:6px; align-items:center}
.badge{font-size:9px; font-weight:700; padding:1px 5px; border-radius:2px; letter-spacing:.4px}
.badge.tp{background:#e4edf6; color:#2e5d8c; border:1px solid #b9cfe4}
.badge.dp{background:#e8f2ea; color:#2f6b46; border:1px solid #bcd8c5}
.rowhead .meta{color:var(--mut); font-size:10.5px; margin-top:2px; line-height:1.5}
.rowhead .meta b{color:var(--txt); font-weight:600}
.rowbody{position:relative; flex:none; display:flex}
.cell{width:var(--colw); flex:none; border-right:1px solid var(--line); position:relative; background:#fff}
.cell.prep{background:repeating-linear-gradient(45deg,#f2f3f4 0 6px,#e7e9ea 6px 12px)}
.cell.nolease{background:#ececec}
.cell.dropok{outline:2px dashed var(--accent); outline-offset:-2px; background:#eef4fa}
.cell .occ{position:absolute; left:0; right:0; bottom:0; height:var(--occh);
  font-size:10px; text-align:center; line-height:var(--occh);
  border-top:1px solid var(--line); color:var(--mut); background:#fafbfb}
.cell .occ.o1{background:#e6f2ea; color:#2f6b46}
.cell .occ.o2{background:#fdf3e0; color:#8a5a12; font-weight:600}
.cell .occ.o3{background:#fbe4e0; color:#a52a1d; font-weight:700}
.card{position:absolute; height:calc(var(--cardh) - 6px);
  background:#fff; border:1px solid var(--line2); border-left:4px solid #888;
  border-radius:3px; padding:3px 6px; overflow:hidden; cursor:grab;
  box-shadow:0 1px 2px rgba(0,0,0,.08); font-size:11px; user-select:none}
.card:active{cursor:grabbing}
.card .t1{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .t2{color:var(--mut); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .wico{color:var(--bad); font-weight:700; margin-left:2px}
.card.hl{box-shadow:0 0 0 2px var(--accent), 0 2px 6px rgba(46,93,140,.35); z-index:9}
.card.dim{opacity:.32}
.card.imp{background:#fdfdf6}
.card .rem{display:inline-block; margin-left:4px; padding:0 4px; border-radius:2px;
  background:#fdf3e0; color:#8a5a12; font-size:9.5px; font-weight:700}

/* ===== data tables (batch / cost tabs) ===== */
.dtwrap{padding:12px}
.dtbar{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.dtbar h2{font-size:13px; font-weight:700; margin-right:6px}
.dtbar .note{color:var(--mut); font-size:11px}
table.dt{border-collapse:separate; border-spacing:0; background:#fff; font-size:11.5px}
.dt th{background:#e9ebed; font-weight:600; padding:5px 8px; border:1px solid var(--line2);
  border-left:none; white-space:nowrap; position:sticky; top:0; z-index:5; text-align:left}
.dt th:first-child{border-left:1px solid var(--line2)}
.dt td{padding:5px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line);
  white-space:nowrap; background:#fff; vertical-align:top}
.dt td:first-child{border-left:1px solid var(--line)}
.dt tr:hover td{background:#f7fafc}
.dt .num{text-align:right; font-variant-numeric:tabular-nums}
.dt td.money{text-align:right; font-variant-numeric:tabular-nums; cursor:default}
.dt td.money.has{background:#f4f8f4}
.dt td.money.pre{background:#eef4fa; font-weight:600}
.dt tr.total td{background:#e2efda; font-weight:700; border-top:2px solid var(--line2)}
.dt .stick{position:sticky; z-index:6; background:#fff}
.dt th.stick{z-index:8; background:#e9ebed}
.dt tr:hover td.stick{background:#f7fafc}
.dt tr.total td.stick{background:#e2efda}
.chip{display:inline-block; border:1px solid var(--line2); border-radius:10px;
  padding:1px 8px; font-size:10.5px; font-weight:600; cursor:pointer; background:#f2f3f4; color:var(--mut)}
.chip.s1{background:#fdf3e0; color:#8a5a12; border-color:#ecd39f}
.chip.s2{background:#e6f2ea; color:#2f6b46; border-color:#bcd8c5}
.chip.auto{cursor:default; opacity:.9}
.batrow{cursor:pointer}
.colorbar{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:0}
.steplegend{margin-top:10px; font-size:11px; color:var(--mut); max-width:900px; line-height:1.7}
.steplegend b{color:var(--txt)}

/* ===== side panel ===== */
#panel{width:300px; flex:none; background:var(--panel); border-left:1px solid var(--line2);
  overflow:auto; padding:10px 12px; display:none}
#panel.open{display:block}
#panel h2{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut);
  border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  display:flex; justify-content:space-between; align-items:center}
#panel h2 .x{border:none; background:none; font-size:14px; color:var(--mut)}
#panel .kv{display:flex; justify-content:space-between; padding:2px 0; font-size:11.5px}
#panel .kv b{font-weight:600}
#panel table{width:100%; border-collapse:collapse; margin:6px 0; font-size:11px}
#panel th{background:#eef0f1; text-align:left; padding:3px 5px; border:1px solid var(--line); font-weight:600}
#panel td{padding:3px 5px; border:1px solid var(--line)}
#panel .warnbox{background:#fbe4e0; border:1px solid #eab8b0; color:#8c2318;
  padding:5px 7px; border-radius:3px; margin:6px 0; font-size:11px}
#panel .notebox{background:#fdf3e0; border:1px solid #ecd39f; color:#7a5210;
  padding:5px 7px; border-radius:3px; margin:6px 0; font-size:11px}
#panel .field{margin:6px 0}
#panel .field label{display:block; font-size:10.5px; color:var(--mut); margin-bottom:2px}
#panel .field input,#panel .field select{width:100%; padding:4px 6px; border:1px solid var(--line2); border-radius:3px; font:inherit}
#panel .btnrow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.sbtn{padding:4px 10px; border:1px solid var(--line2); background:#fff; border-radius:3px; font-size:11.5px}
.sbtn:hover{background:#f0f2f3}
.sbtn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.sbtn.danger{color:var(--bad); border-color:#dba79f}

/* ===== modal ===== */
#mask{position:fixed; inset:0; background:rgba(20,24,28,.45); display:none;
  align-items:flex-start; justify-content:center; z-index:100; padding-top:6vh}
#mask.open{display:flex}
#modal{background:#fff; border-radius:5px; width:460px; max-width:96vw;
  box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal.wide{width:820px}
#modal header{padding:9px 14px; border-bottom:1px solid var(--line); font-weight:700; font-size:13px}
#modal .body{padding:10px 14px; max-height:66vh; overflow:auto}
#modal footer{padding:9px 14px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px}
#modal .field{margin:8px 0}
#modal .field label{display:block; font-size:11px; color:var(--mut); margin-bottom:3px; font-weight:600}
#modal .field input,#modal .field select{width:100%; padding:5px 7px; border:1px solid var(--line2); border-radius:3px; font:inherit}
#modal .row2{display:flex; gap:10px}
#modal .row2 .field{flex:1}
#modal .mini{font-size:10.5px; color:var(--mut); margin-top:2px}
#modal h4{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--mut);
  border-bottom:1px solid var(--line); margin:14px 0 6px; padding-bottom:3px}
.costov{display:grid; grid-template-columns:18px 1fr 120px 110px; gap:6px; align-items:center; margin:4px 0; font-size:11.5px}
.costov input[type=number],.costov select{padding:3px 6px; border:1px solid var(--line2); border-radius:3px; font:inherit; width:100%}
table.deft{width:100%; border-collapse:collapse; font-size:11.5px}
.deft th{background:#e9ebed; padding:4px 6px; border:1px solid var(--line2); font-weight:600; text-align:left}
.deft td{padding:3px 5px; border:1px solid var(--line)}
.deft input,.deft select{width:100%; padding:3px 5px; border:1px solid var(--line2); border-radius:3px; font:inherit}

/* ===== legend ===== */
#legend{flex:none; background:#eceeef; border-top:1px solid var(--line2);
  padding:4px 12px; font-size:10.5px; color:var(--mut); display:flex; gap:16px; flex-wrap:wrap}
#legend .sw{display:inline-block; width:11px; height:11px; vertical-align:-2px;
  margin-right:3px; border:1px solid var(--line2); border-radius:2px}
</style>
</head>
<body>

<div id="toolbar">
  <h1>CAR FLOW PLANNER</h1>
  <div id="tbActions" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <button class="tbtn" id="langBtn" onclick="toggleLang()">EN</button>
</div>
<div id="tabs"></div>

<div id="main">
  <div id="boardwrap"><div id="board"></div></div>
  <aside id="panel"></aside>
</div>

<div id="legend"></div>

<input type="file" id="fileInput" accept=".json" hidden>
<div id="mask"><div id="modal"></div></div>

function migrate(s){
  s.lang ??= 'vi'; s.fxRate ??= 16800; s.investRate ??= 50000000;
  s.costDefs ??= defaultCostDefs();
  (s.locations||[]).forEach(l=>{
    l.address ??= ''; l.gmaps ??= ''; l.costOv ??= {};
    l.leaseMonths ??= Math.max(1, s.numMonths - (l.leaseStart||0));
    if(l.type==='dp') l.investOverride ??= null;
  });
  (s.batches||[]).forEach(b=>{
    b.steps ??= {quota:0,tera:0,kir:0,kp:0,stnk:0};
    if(!b.importDate){ b.importDate = monthToDate(s, b.importMonth??0); }
    b.importMonth = dateToMonth(s, b.importDate);
  });
  return s;
}

/* ================= MONTH / DATE HELPERS ================= */
function baseYM(s){const [y,m]=(s||state).startMonth.split('-').map(Number);return y*12+(m-1)}
function mLabel(i,withYear=true){
  const tot=baseYM(state)+i, yy=Math.floor(tot/12), mm=tot%12+1;
  return withYear?`T${mm}/${String(yy).slice(2)}`:`T${mm}`;
}
function monthToDate(s,i){const tot=baseYM(s)+i;return `${Math.floor(tot/12)}-${String(tot%12+1).padStart(2,'0')}-01`}
function dateToMonth(s,d){
  if(!d)return 0;
  const [y,m]=d.split('-').map(Number);
  return Math.min(Math.max((y*12+(m-1))-baseYM(s),0),(s.numMonths||18)-1);
}
function monthOpts(sel){let o='';for(let i=0;i<state.numMonths;i++)o+=`<option value="${i}" ${i===sel?'selected':''}>${mLabel(i)}</option>`;return o}
const H=()=>state.numMonths-1;

/* ================= DERIVED ================= */
const loc=id=>state.locations.find(l=>l.id===id);
const bat=id=>state.batches.find(b=>b.id===id);
function effCap(l){
  if(l.type==='tp')return l.capacity||0;
  const hr=(l.homeRate||0)/100;
  return hr<1?Math.round((l.slots||0)/(1-hr)):(l.slots||0);
}
const readyMonth=l=>(l.leaseStart??0)+(l.prep??0);
function occupancy(locId,m){return state.cards.filter(c=>c.locationId===locId&&c.from<=m&&c.to>=m).reduce((s,c)=>s+c.qty,0)}
function tpAllocated(bid){return state.cards.filter(c=>c.batchId===bid&&loc(c.locationId)?.type==='tp').reduce((s,c)=>s+c.qty,0)}
function dpAllocated(bid){return state.cards.filter(c=>c.batchId===bid&&loc(c.locationId)?.type==='dp').reduce((s,c)=>s+c.qty,0)}
const batchAutoDone=b=>dpAllocated(b.id)>=b.qty;

/* ================= COST ENGINE ================= */
const toIDR=(amt,cur)=>cur==='USD'?amt*state.fxRate:amt;
const defName=d=>typeof d.name==='object'?(d.name[state.lang]||d.name.vi):d.name;
function locDefs(l){return state.costDefs.filter(d=>d.scope===l.type||d.scope==='both')}
function costsByMonth(l){
  const NM=state.numMonths;
  const cells=Array.from({length:NM},()=>({tot:0,items:[]}));
  const push=(m,label,amt,cur)=>{
    if(m<0||m>=NM||!amt)return;
    cells[m].tot+=toIDR(amt,cur);
    cells[m].items.push({label,amt,cur});
  };
  const ls=l.leaseStart??0, lm=Math.max(1,l.leaseMonths||1);
  const lend=Math.min(ls+lm-1,NM-1);
  for(const d of locDefs(l)){
    const ov=(l.costOv||{})[d.id]||{};
    if(ov.off)continue;
    const amt=(ov.amount??d.amount)||0;
    if(d.basis==='per_m2_month'){
      const monthly=amt*(l.area||0);
      if((d.timing||'prepaid')==='prepaid') push(ls,defName(d),monthly*lm,d.currency);
      else for(let m=ls;m<=lend;m++) push(m,defName(d),monthly,d.currency);
    }else if(d.basis==='monthly'){
      for(let m=ls;m<=lend;m++) push(m,defName(d),amt,d.currency);
    }else{ // once
      push(ov.payMonth??ls,defName(d),amt,d.currency);
    }
  }
  if(l.type==='dp'){
    const rate=l.investOverride??state.investRate;
    push(ls,t('c_construction'),rate*(l.slots||0),'IDR');
  }
  return cells;
}

/* ================= FORMAT ================= */
function fmtN(n){return (Number(n)||0).toLocaleString(state.lang==='vi'?'vi-VN':'en-US')}
function fmtMoney(n){
  n=Number(n)||0; const a=Math.abs(n);
  const loc2=state.lang==='vi'?'vi-VN':'en-US';
  if(a>=1e9)return (n/1e9).toLocaleString(loc2,{maximumFractionDigits:2})+'B';
  if(a>=1e6)return (n/1e6).toLocaleString(loc2,{maximumFractionDigits:1})+'M';
  return n.toLocaleString(loc2);
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderBoard(){

  }

  html+=secTitle(t('lay2'),'tp');
  state.locations.filter(l=>l.type==='tp').forEach(l=>html+=locRow(l));

  state.locations.filter(l=>l.type==='dp').forEach(l=>html+=locRow(l));

function secTitle(txt,addType){
  const btn=addType?`<button class="addloc" onclick="openLocModal(null,'${addType}')">${t('add')}</button>`:'';
  return `<div class="secrow"><div class="sectitle"><span>${txt}</span>${btn}</div><div class="secfill"></div></div>`;
}
function laneAssign(cards){
  const lanes=[];
  cards.sort((a,b)=>a.from-b.from||a.to-b.to);
  cards.forEach(c=>{let ln=0;while(lanes[ln]!==undefined&&lanes[ln]>=c.from)ln++;lanes[ln]=c.to;c._lane=ln;});
  return Math.max(1,lanes.length);
}
function cardHTML(c){
  const b=bat(c.batchId); if(!b)return'';
  const l=c.locationId?loc(c.locationId):null;
  const warn=l&&c.from<readyMonth(l)?'<span class="wico">⚠</span>':'';
  return `<div class="card" draggable="true" data-card="${c.id}" data-batch="${c.batchId}"
    style="left:calc(${c.from}*var(--colw) + 2px);width:calc(${c.to-c.from+1}*var(--colw) - 5px);top:${c._lane*46+3}px;border-left-color:${b.color}">
    <div class="t1">${esc(b.name)} · ${fmtN(c.qty)} ${t('cars')}${warn}</div>
    <div class="t2">${esc(b.vehicleType)} · ${mLabel(c.from)}→${mLabel(c.to)}</div></div>`;
}
function importRow(){
  const NM=state.numMonths;
  const imp=state.batches.map(b=>({batchId:b.id,from:b.importMonth,to:b.importMonth}));
  const lanes=laneAssign(imp);
  const bodyH=lanes*46+6;
  let cells='';
  for(let m=0;m<NM;m++)cells+=`<div class="cell" data-row="__import__" data-month="${m}" style="height:${bodyH}px"></div>`;
  let cardsH='';
  imp.forEach(c=>{
    const b=bat(c.batchId);
    const rem=b.qty-tpAllocated(b.id);
    const remBadge=rem>0?`<span class="rem">${t('remain')} ${fmtN(rem)}</span>`
      :(rem<0?`<span class="rem" style="background:#fbe4e0;color:#a52a1d">${t('over_alloc')} ${fmtN(-rem)}</span>`:'');
    cardsH+=`<div class="card imp" draggable="true" data-imp="${b.id}" data-batch="${b.id}"
      style="left:calc(${c.from}*var(--colw) + 2px);width:calc(var(--colw) - 5px);top:${c._lane*46+3}px;border-left-color:${b.color}">
      <div class="t1">${esc(b.name)} · ${fmtN(b.qty)}${remBadge}</div>
      <div class="t2">${esc(b.vehicleType)} · ${t('import_lbl')} ${mLabel(c.from)}</div></div>`;
  });
  return `<div class="lrow">
    <div class="rowhead" onclick="showImportInfo()">
      <div class="nm">${t('imp_row')}</div>
      <div class="meta">${t('imp_meta1')}<br>${t('imp_meta2')} <b>${state.regDuration} ${t('month_s')}</b> ${t('to_depot')}</div>
    </div><div class="rowbody" style="height:${bodyH}px">${cells}${cardsH}</div></div>`;
}
function locRow(l){
  const NM=state.numMonths;
  const myCards=state.cards.filter(c=>c.locationId===l.id);
  const lanes=laneAssign(myCards);
  const bodyH=lanes*46+6+18;
  const cap=effCap(l);
  let cells='';
  for(let m=0;m<NM;m++){
    const cls=m<(l.leaseStart??0)?'nolease':(m<readyMonth(l)?'prep':'');
    const o=occupancy(l.id,m);
    let ocls='';if(o>0){ocls=o>cap?'o3':(o>=cap*0.8?'o2':'o1')}
    cells+=`<div class="cell ${cls}" data-row="${l.id}" data-month="${m}" style="height:${bodyH}px">
      <div class="occ ${ocls}" title="${fmtN(o)} / ${fmtN(cap)}">${o>0?fmtN(o):''}</div></div>`;
  }
  let cardsH='';myCards.forEach(c=>cardsH+=cardHTML(c));
  const badge=l.type==='tp'?`<span class="badge tp">${t('tp').toUpperCase()}</span>`:`<span class="badge dp">${t('dp').toUpperCase()}</span>`;
  const capLine=l.type==='tp'
    ?`${t('cap')} <b>${fmtN(cap)}</b> ${t('cars')} · ${fmtN(l.area)} m²`
    :`<b>${fmtN(l.slots)}</b> ${t('slot')} ×(1−${l.homeRate}%)→ <b>${fmtN(cap)}</b> ${t('cars')} · ${fmtN(l.area)} m²`;
  return `<div class="lrow">
    <div class="rowhead" onclick="openLocModal('${l.id}')">
      <div class="nm">${badge}${esc(l.name)}</div>
      <div class="meta">${esc(l.region||'')}<br>${capLine}<br>${t('lease_from')} <b>${mLabel(l.leaseStart)}</b> · ${t('prep_short')} ${l.prep} ${t('mo')} → ${t('use_from')} <b>${mLabel(Math.min(readyMonth(l),H()))}</b></div>
    </div><div class="rowbody" style="height:${bodyH}px">${cells}${cardsH}</div></div>`;
}

function stepChip(b,st){
  const auto=batchAutoDone(b);
  const v=auto?2:(b.steps?.[st]??0);
  const cls=v===2?'s2':(v===1?'s1':'');
  const lbl=auto?t('bt_auto'):t('st'+v);
  const click=auto?'':`onclick="cycleStep('${b.id}','${st}')"`;
  return `<button class="chip ${cls} ${auto?'auto':''}" ${click}>${lbl}</button>`;
}
function cycleStep(bid,st){
  const b=bat(bid); if(!b||batchAutoDone(b))return;
  b.steps??={};
  b.steps[st]=((b.steps[st]??0)+1)%3;
  render();
}
function renderBatchTab(){

function renderCostTab(type){
  board.style.width='100%';
  const NM=state.numMonths;
  const locs=state.locations.filter(l=>l.type===type);
  const W=[150,170,52,72,72]; // sticky widths
  const offs=W.reduce((a,w,i)=>{a.push((a[i-1]??0)+(W[i-1]??0));return a},[]);
  const st=i=>`class="stick" style="left:${offs[i]}px;min-width:${W[i]}px;max-width:${W[i]+60}px"`;
  const stH=i=>`class="stick" style="left:${offs[i]}px;min-width:${W[i]}px"`;

  let mTH='';for(let m=0;m<NM;m++)mTH+=`<th class="num">${mLabel(m)}</th>`;
  let rows='', colTot=Array(NM).fill(0), grand=0;
  locs.forEach(l=>{
    const cells=costsByMonth(l);
    let rowTot=0, tds='';
    cells.forEach((c,m)=>{
      colTot[m]+=c.tot; rowTot+=c.tot;

    rows+=`<tr>

      <td ${st(1)} style="left:${offs[1]}px;min-width:${W[1]}px;white-space:normal">${esc(l.address||'')}</td>
      <td ${st(2)} style="left:${offs[2]}px;min-width:${W[2]}px">${map}</td>

      <td ${st(4)} style="left:${offs[4]}px;min-width:${W[4]}px" class="stick num">${fmtN(cap)}</td>
      ${tds}<td class="money pre">${fmtMoney(rowTot)}</td></tr>`;
  });
  let totTds='';colTot.forEach(v=>totTds+=`<td class="money">${v?fmtMoney(v):''}</td>`);
  const usd=grand/state.fxRate;
  board.innerHTML=`<div class="dtwrap">
    <div class="dtbar"><h2>${type==='tp'?t('tpt_title'):t('dpt_title')}</h2>
      <button class="sbtn primary" onclick="openLocModal(null,'${type}')">${type==='tp'?t('add_tp'):t('add_dp')}</button>
      <button class="sbtn" onclick="openCostDefs()">${t('cost_defs')}</button>
      <span class="note">${t('c_grand')}: <b>${fmtN(Math.round(grand))} IDR</b> ≈ ${fmtN(Math.round(usd))} USD (fx ${fmtN(state.fxRate)})</span></div>
    <table class="dt"><thead><tr>
      <th ${stH(0)}>${t('c_name')}</th><th ${stH(1)}>${t('c_addr')}</th><th ${stH(2)}>${t('c_map')}</th>
      <th ${stH(3)}>${t('c_area')}</th><th ${stH(4)}>${t('c_cap')}</th>${mTH}<th class="num">${t('c_total')}</th>
    </tr></thead><tbody>${rows}
    <tr class="total"><td class="stick" style="left:0;min-width:${W[0]}px">${t('c_all')}</td>
      <td class="stick" style="left:${offs[1]}px;min-width:${W[1]}px"></td>

  <div class="kv"><span>${t('vtype')}</span><b>${esc(b.vehicleType)}</b></div>
  <div class="kv"><span>${t('qty_import')}</span><b>${fmtN(b.qty)} · ${esc(b.importDate||mLabel(b.importMonth))}</b></div>

  <div class="kv"><span>${t('alloc_tp')}</span><b>${fmtN(tp)}</b></div>

function saveCardEdit(id){
  const c=state.cards.find(x=>x.id===id);if(!c)return;
  c.locationId=document.getElementById('ce_loc').value;
  let f=+document.getElementById('ce_from').value,t2=+document.getElementById('ce_to').value;
  if(t2<f)t2=f; c.from=f;c.to=t2;
  c.qty=Math.max(1,+document.getElementById('ce_qty').value||1);
  render();showBatchPanel(selBatch,id);
}
function splitCard(id){
  const c=state.cards.find(x=>x.id===id);if(!c||c.qty<2)return;
  const q=Math.floor(c.qty/2);
  const n={...c,id:uid(),qty:c.qty-q};c.qty=q;delete n._lane;
  state.cards.push(n);render();showBatchPanel(selBatch,id);
}
function delCard(id){
  state.cards=state.cards.filter(x=>x.id!==id);
  selCard=null;render();showBatchPanel(selBatch);
}

/* ================= DRAG & DROP ================= */
function attachDnD(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      const payload=el.dataset.imp?{kind:'imp',batchId:el.dataset.imp}:{kind:'card',cardId:el.dataset.card};
      e.dataTransfer.setData('text/plain',JSON.stringify(payload));
      e.dataTransfer.effectAllowed='move';
    });
  });
  document.querySelectorAll('.cell').forEach(cell=>{
    cell.addEventListener('dragover',e=>{
      if(cell.dataset.row==='__import__')return;
      e.preventDefault();cell.classList.add('dropok');
    });
    cell.addEventListener('dragleave',()=>cell.classList.remove('dropok'));
    cell.addEventListener('drop',e=>{
      e.preventDefault();cell.classList.remove('dropok');
      let p;try{p=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
      handleDrop(p,cell.dataset.row,+cell.dataset.month);
    });
  });
}
function handleDrop(p,rowId,m){
  if(rowId==='__import__')return;
  const target=loc(rowId);if(!target)return;
  if(p.kind==='imp'){
    const b=bat(p.batchId);if(!b)return;
    if(target.type==='tp'){
      const rem=b.qty-tpAllocated(b.id);
      qtyDialog(t('d_alloc')(b.name,target.name),
        `${t('d_month_in')}: <b>${mLabel(m)}</b> · ${t('d_batch')} ${fmtN(b.qty)} · ${t('d_not_alloc')}: ${fmtN(Math.max(rem,0))}`,
        rem>0?rem:b.qty,q=>{
          state.cards.push({id:uid(),batchId:b.id,qty:q,locationId:target.id,from:m,to:Math.min(m+state.regDuration-1,H())});
          selBatch=b.id;render();showBatchPanel(b.id);
        });
    }else{
      qtyDialog(t('d_direct')(b.name,target.name),`${t('d_month_in')}: <b>${mLabel(m)}</b>`,b.qty,q=>{
        state.cards.push({id:uid(),batchId:b.id,qty:q,locationId:target.id,from:m,to:H()});
        selBatch=b.id;render();showBatchPanel(b.id);
      });
    }
    return;
  }
  const c=state.cards.find(x=>x.id===p.cardId);if(!c)return;
  const src=loc(c.locationId);
  if(src&&src.type==='tp'&&target.type==='dp'){
    qtyDialog(t('d_move')(target.name),
      `${t('d_from')} ${src.name} · ${t('d_card')} ${fmtN(c.qty)} · ${t('d_into')} <b>${mLabel(m)}</b>`,
      c.qty,q=>{
        q=Math.min(q,c.qty);
        if(q>=c.qty){
          if(m>c.from){c.to=m-1}else{state.cards=state.cards.filter(x=>x.id!==c.id)}
        }else{
          c.qty-=q;
          if(m>c.from)state.cards.push({id:uid(),batchId:c.batchId,qty:q,locationId:c.locationId,from:c.from,to:m-1});
        }
        state.cards.push({id:uid(),batchId:c.batchId,qty:q,locationId:target.id,from:m,to:H()});
        selBatch=c.batchId;render();showBatchPanel(c.batchId);
      });
    return;
  }
  const d=c.to-c.from;
  c.locationId=target.id;c.from=m;c.to=Math.min(m+d,H());
  selBatch=c.batchId;selCard=c.id;
  render();showBatchPanel(c.batchId,c.id);
}

function readCostOv(){
  const ov={};
  document.querySelectorAll('[data-ovon]').forEach(cb=>{
    const id=cb.dataset.ovon;
    const a=document.querySelector(`[data-ova="${id}"]`);
    const mSel=document.querySelector(`[data-ovm="${id}"]`);

  const del=l?`<button class="sbtn danger" style="margin-right:auto" onclick="delLoc('${l.id}')">${t('del_loc')}</button>`:'';
  openModal(l?`${esc(l.name)}`:(isTP?t('m_tp_new'):t('m_dp_new')),`
    <div class="field"><label>${t('l_name')}</label><input id="l_name" value="${l?esc(l.name):''}"></div>
    <div class="row2">
      <div class="field"><label>${t('l_region')}</label><input id="l_region" value="${l?esc(l.region||''):''}"></div>
      <div class="field"><label>${t('l_area')}</label><input id="l_area" type="number" min="0" value="${l?l.area:''}"></div>
    </div>
    <div class="field"><label>${t('l_addr')}</label><input id="l_addr" value="${l?esc(l.address||''):''}"></div>
    <div class="field"><label>${t('l_gmaps')}</label><input id="l_gmaps" value="${l?esc(l.gmaps||''):''}" placeholder="https://maps.google.com/..."></div>
    ${capBlock}
    <div class="row2">
      <div class="field"><label>${t('l_lease')}</label><select id="l_lease">${monthOpts(l?l.leaseStart:0)}</select></div>
      <div class="field"><label>${t('l_leasem')}</label><input id="l_leasem" type="number" min="1" value="${l?l.leaseMonths:(isTP?12:18)}"></div>
    </div>
    <div class="field"><label>${t('l_prep')}</label><input id="l_prep" type="number" min="0" value="${l?l.prep:(isTP?1:6)}">
      <div class="mini">${isTP?t('l_prep_tp'):t('l_prep_dp')}</div></div>
    ${costOvBlock(l,tt)}`,
    l?t('save'):t('add_loc'),()=>{
      const name=document.getElementById('l_name').value.trim();
      if(!name){alert(t('need_name'));return}
      const area=+document.getElementById('l_area').value||0;
      const o={type:tt,name,region:document.getElementById('l_region').value.trim(),
        address:document.getElementById('l_addr').value.trim(),
        gmaps:document.getElementById('l_gmaps').value.trim(),area,
        leaseStart:+document.getElementById('l_lease').value,
        leaseMonths:Math.max(1,+document.getElementById('l_leasem').value||1),
        prep:Math.max(0,+document.getElementById('l_prep').value||0),
        costOv:readCostOv()};
      if(isTP){
        let cap=+document.getElementById('l_cap').value;
        if(!cap)cap=Math.round(area/16.5);
        o.capacity=cap;
      }else{
        o.slots=+document.getElementById('l_slots').value||0;
        o.homeRate=Math.min(99,Math.max(0,+document.getElementById('l_home').value||0));
        const iv=document.getElementById('l_invest').value;
        o.investOverride=iv===''?null:+iv;
      }
      if(l)Object.assign(l,o);else state.locations.push({id:uid(),...o});
      closeModal();render();
    },del,true);
}
function delLoc(lid){
  const n=state.cards.filter(c=>c.locationId===lid).length;
  if(!confirm(t('confirm_del_loc')(n)))return;
  state.locations=state.locations.filter(l=>l.id!==lid);
  state.cards=state.cards.filter(c=>c.locationId!==lid);
  closeModal();render();
}

function openCostDefs(){
  const basisOpt=v=>['once','monthly','per_m2_month'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x==='once'?t('basis_once'):(x==='monthly'?t('basis_monthly'):t('basis_m2'))}</option>`).join('');
  const scopeOpt=v=>['tp','dp','both'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x==='tp'?t('scope_tp'):(x==='dp'?t('scope_dp'):t('scope_both'))}</option>`).join('');
  const timeOpt=v=>['prepaid','monthly'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x==='prepaid'?t('timing_pre'):t('timing_mo')}</option>`).join('');
  const curOpt=v=>['IDR','USD'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  const rowsH=state.costDefs.map(d=>{
    const nm=typeof d.name==='object'?d.name:{vi:d.name,en:d.name};
    return `<tr data-def="${d.id}">
    <td><input data-f="nvi" value="${esc(nm.vi)}"></td>
    <td><input data-f="nen" value="${esc(nm.en)}"></td>
    <td><select data-f="scope">${scopeOpt(d.scope)}</select></td>
    <td><select data-f="basis">${basisOpt(d.basis)}</select></td>
    <td><input data-f="amount" type="number" value="${d.amount}"></td>
    <td><select data-f="cur">${curOpt(d.currency)}</select></td>
    <td><select data-f="timing">${timeOpt(d.timing||'prepaid')}</select></td>
    <td><button class="sbtn danger" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
  }).join('');
  openModal(t('m_defs'),`
    <table class="deft" id="defTable"><tr>
      <th>${t('df_name_vi')}</th><th>${t('df_name_en')}</th><th>${t('df_scope')}</th><th>${t('df_basis')}</th>
      <th>${t('df_amount')}</th><th>${t('df_cur')}</th><th>${t('df_timing')}</th><th></th></tr>${rowsH}</table>
    <div style="margin-top:8px"><button class="sbtn" onclick="addDefRow()">${t('df_add')}</button></div>
    <div class="mini" style="margin-top:8px">${t('basis_m2')}: ${state.lang==='vi'?'đơn giá × diện tích × số tháng thuê; "Trả trước cả kỳ" = chi toàn bộ tại tháng bắt đầu thuê':'rate × area × lease months; "Prepaid full term" = paid entirely at lease start'}.</div>`,
    t('save'),()=>{
      const defs=[];
      document.querySelectorAll('#defTable tr[data-def]').forEach(tr=>{
        const g=f=>tr.querySelector(`[data-f="${f}"]`).value;
        defs.push({id:tr.dataset.def,name:{vi:g('nvi'),en:g('nen')},scope:g('scope'),
          basis:g('basis'),amount:+g('amount')||0,currency:g('cur'),timing:g('timing')});
      });
      state.costDefs=defs;closeModal();render();
    },'',true);
}
function addDefRow(){
  const tb=document.getElementById('defTable');
  const id=uid();
  const tr=document.createElement('tr');tr.dataset.def=id;
  tr.innerHTML=`<td><input data-f="nvi" value=""></td><td><input data-f="nen" value=""></td>
  <td><select data-f="scope"><option value="tp">${t('scope_tp')}</option><option value="dp">${t('scope_dp')}</option><option value="both">${t('scope_both')}</option></select></td>
  <td><select data-f="basis"><option value="once">${t('basis_once')}</option><option value="monthly">${t('basis_monthly')}</option><option value="per_m2_month">${t('basis_m2')}</option></select></td>
  <td><input data-f="amount" type="number" value="0"></td>
  <td><select data-f="cur"><option>IDR</option><option>USD</option></select></td>
  <td><select data-f="timing"><option value="prepaid">${t('timing_pre')}</option><option value="monthly">${t('timing_mo')}</option></select></td>
  <td><button class="sbtn danger" onclick="this.closest('tr').remove()">✕</button></td>`;
  tb.appendChild(tr);
}

function openSettings(){
  openModal(t('m_set'),`
    <div class="row2">
      <div class="field"><label>${t('s_start')}</label><input id="s_start" type="month" value="${state.startMonth}"></div>
      <div class="field"><label>${t('s_num')}</label><input id="s_num" type="number" min="3" max="60" value="${state.numMonths}"></div>
    </div>
    <div class="field"><label>${t('s_reg')}</label><input id="s_reg" type="number" min="1" max="12" value="${state.regDuration}"></div>
    <div class="row2">
      <div class="field"><label>${t('s_fx')}</label><input id="s_fx" type="number" min="1" value="${state.fxRate}"></div>
      <div class="field"><label>${t('s_invest')}</label><input id="s_invest" type="number" min="0" value="${state.investRate}"></div>
    </div>`,
    t('save'),()=>{
      state.startMonth=document.getElementById('s_start').value||state.startMonth;
      state.numMonths=Math.min(60,Math.max(3,+document.getElementById('s_num').value||18));
      state.regDuration=Math.max(1,+document.getElementById('s_reg').value||2);
      state.fxRate=Math.max(1,+document.getElementById('s_fx').value||16800);
      state.investRate=Math.max(0,+document.getElementById('s_invest').value||0);
      state.batches.forEach(b=>{b.importMonth=dateToMonth(state,b.importDate)});
      state.cards.forEach(c=>{c.from=Math.min(c.from,H());c.to=Math.min(Math.max(c.to,c.from),H())});
      state.locations.forEach(l=>l.leaseStart=Math.min(l.leaseStart,H()));
      closeModal();render();
    });
}

/* ================= JSON ================= */
function saveJSON(){
  const clean=JSON.parse(JSON.stringify(state));
  clean.cards.forEach(c=>delete c._lane);
  download(new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}),'car_flow_plan.json');
}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.locations||!s.batches||!s.cards)throw 0;
      state=migrate(s);selBatch=null;selCard=null;closePanel();render();
    }catch(_){alert(t('json_bad'))}
  };
  r.readAsText(f);e.target.value='';
});
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ================= EXCEL EXPORT ================= */
function exportExcel(){
  const NM=state.numMonths;
  const xEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const cS=v=>`<Cell><Data ss:Type="String">${xEsc(v)}</Data></Cell>`;
  const cSH=v=>`<Cell ss:StyleID="h"><Data ss:Type="String">${xEsc(v)}</Data></Cell>`;
  const cN=v=>`<Cell ss:StyleID="n"><Data ss:Type="Number">${Number(v)||0}</Data></Cell>`;
  const row=c=>`<Row>${c}</Row>`;

  let s1=row(['No',t('c_name'),t('df_scope'),t('l_region'),t('l_addr'),t('l_gmaps'),t('c_area'),t('c_cap'),t('l_slots'),t('l_home'),t('l_lease'),t('l_leasem'),t('l_prep')].map(cSH).join(''));
  state.locations.forEach((l,i)=>{
    s1+=row(cN(i+1)+cS(l.name)+cS(l.type==='tp'?t('tp'):t('dp'))+cS(l.region||'')+cS(l.address||'')+cS(l.gmaps||'')
      +cN(l.area)+cN(effCap(l))+(l.type==='dp'?cN(l.slots):cS(''))+(l.type==='dp'?cN(l.homeRate):cS(''))
      +cS(mLabel(l.leaseStart))+cN(l.leaseMonths)+cN(l.prep));
  });

  let s2=row([t('batch'),t('vtype'),t('qty'),t('bt_date'),t('alloc_tp'),t('alloc_dp'),...STEPS.map(s=>STEP_LBL[s]),t('bt_prog')].map(cSH).join(''));
  state.batches.forEach(b=>{
    const auto=batchAutoDone(b);
    const stepVals=STEPS.map(s=>auto?t('bt_auto'):t('st'+(b.steps?.[s]??0)));
    const done=auto?STEPS.length:STEPS.filter(s=>(b.steps?.[s]??0)===2).length;
    s2+=row(cS(b.name)+cS(b.vehicleType)+cN(b.qty)+cS(b.importDate||mLabel(b.importMonth))
      +cN(tpAllocated(b.id))+cN(dpAllocated(b.id))+stepVals.map(cS).join('')+cS(`${done}/${STEPS.length}`));
  });

  let s3=row([t('batch'),t('vtype'),t('qty'),t('layer'),t('locn'),t('d_from'),t('to_m'),t('month_s')].map(cSH).join(''));
  state.cards.forEach(c=>{
    const b=bat(c.batchId),l=loc(c.locationId);
    s3+=row(cS(b?b.name:'?')+cS(b?b.vehicleType:'')+cN(c.qty)+cS(l?(l.type==='tp'?t('tp'):t('dp')):'?')
      +cS(l?l.name:'?')+cS(mLabel(c.from))+cS(mLabel(c.to))+cN(c.to-c.from+1));
  });

  let hdr4=cSH(t('locn'))+cSH(t('df_scope'))+cSH('Capacity');
  for(let m=0;m<NM;m++)hdr4+=cSH(mLabel(m));
  let s4=row(hdr4);
  state.locations.forEach(l=>{
    let r=cS(l.name)+cS(l.type==='tp'?t('tp'):t('dp'))+cN(effCap(l));
    for(let m=0;m<NM;m++)r+=cN(occupancy(l.id,m));
    s4+=row(r);
  });

  const costSheet=type=>{
    let hdr=cSH(t('locn'));
    for(let m=0;m<NM;m++)hdr+=cSH(mLabel(m));
    hdr+=cSH(t('c_total'));
    let s=row(hdr);
    const colTot=Array(NM).fill(0);let grand=0;
    state.locations.filter(l=>l.type===type).forEach(l=>{
      const cells=costsByMonth(l);let r=cS(l.name),rt=0;
      cells.forEach((c,m)=>{colTot[m]+=c.tot;rt+=c.tot;r+=cN(Math.round(c.tot))});
      grand+=rt;s+=row(r+cN(Math.round(rt)));
    });
    let tr=cS(t('c_all'));colTot.forEach(v=>tr+=cN(Math.round(v)));tr+=cN(Math.round(grand));
    return s+row(tr);
  };

  const ws=(name,rows)=>`<Worksheet ss:Name="${name}"><Table>${rows}</Table></Worksheet>`;
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
<Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#D9D9D9" ss:Pattern="Solid"/></Style>
<Style ss:ID="n"><NumberFormat ss:Format="#,##0"/></Style>
</Styles>
${ws('Locations',s1)}${ws('Batches',s2)}${ws('Allocations',s3)}${ws('Occupancy',s4)}
${ws('Cost TP (IDR)',costSheet('tp'))}${ws('Cost Depot (IDR)',costSheet('dp'))}
</Workbook>`;
  download(new Blob([xml],{type:'application/vnd.ms-excel'}),'car_flow_plan.xls');
}

/* ================= INIT ================= */
state=migrate(defaultState());
render();
</script>
